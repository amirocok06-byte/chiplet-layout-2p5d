[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chiplet-layout-workflow"
version = "0.1.0"
description = "Safe workflow tooling for 面向2.5D系统集成的芯粒布局方法 research"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "jsonschema>=4,<5",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
test = [
    "openai>=1,<3",
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chiplet_layout_workflow.prompt_assets" = ["*.md"]
"chiplet_layout_workflow.schema_assets" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
